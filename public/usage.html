<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLM Router · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --card: #181b24; --border: #262a36; --text: #e6e8ee;
    --muted: #8b91a1; --accent: #6c8cff; --ok: #3ddc97; --warn: #ffb454; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; gap: 16px; }
  .stats { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .charts { grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .chart-box { min-height: 260px; position: relative; }
  canvas { max-height: 240px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  input { background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; flex: 1; min-width: 200px; }
  button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button.danger { background: var(--danger); }
  .budget-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .budget-fill { height: 100%; transition: width .3s; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: rgba(61,220,151,.15); color: var(--ok); }
  .badge.warn { background: rgba(255,180,84,.15); color: var(--warn); }
  .badge.danger { background: rgba(255,107,107,.15); color: var(--danger); }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <h1>🛰️ LLM Router Dashboard</h1>
  <div class="sub">Deno Deploy · 实时用量监控 · <span id="baseUrl"></span></div>

  <div class="toolbar">
    <input id="proxyKey" placeholder="X-Proxy-Key（同域自动填充）" />
    <button onclick="loadData(true)">🔄 刷新</button>
    <button class="danger" onclick="resetUsage()">🗑️ 清零</button>
    <span id="status"></span>
  </div>

  <div class="grid stats">
    <div class="card"><div class="stat-label">累计总 Tokens</div><div class="stat-value" id="s-total">–</div></div>
    <div class="card"><div class="stat-label">今日 Tokens</div><div class="stat-value" id="s-today">–</div><div class="stat-sub" id="s-today-req"></div></div>
    <div class="card"><div class="stat-label">累计请求</div><div class="stat-value" id="s-req">–</div></div>
    <div class="card">
      <div class="stat-label">本月预算</div>
      <div class="stat-value" id="s-budget">–</div>
      <div class="budget-bar"><div class="budget-fill" id="budgetFill"></div></div>
    </div>
  </div>

  <div class="grid charts">
    <div class="card"><div class="stat-label" style="margin-bottom:8px">📈 近 24 小时（tokens / 小时）</div><div class="chart-box"><canvas id="chartSeries"></canvas></div></div>
    <div class="card"><div class="stat-label" style="margin-bottom:8px">📊 模型分布（tokens）</div><div class="chart-box"><canvas id="chartModel"></canvas></div></div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="card"><div class="stat-label" style="margin-bottom:8px">📋 模型明细</div><table id="tblModel"><thead><tr><th>Model</th><th>请求</th><th>Tokens</th></tr></thead><tbody></tbody></table></div>
    <div class="card"><div class="stat-label" style="margin-bottom:8px">🔌 Provider 明细</div><table id="tblProvider"><thead><tr><th>Provider</th><th>请求</th><th>Tokens</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const base = location.origin;
document.getElementById("baseUrl").textContent = base;
const KEY_INPUT = document.getElementById("proxyKey");
KEY_INPUT.value = localStorage.getItem("proxyKey") || "";
KEY_INPUT.addEventListener("input", () => localStorage.setItem("proxyKey", KEY_INPUT.value));

let seriesChart, modelChart;

function authHeaders() {
  const k = KEY_INPUT.value.trim();
  return k ? { "X-Proxy-Key": k } : {};
}
function toast(msg, ok = true) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderColor = ok ? "var(--ok)" : "var(--danger)";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
function fmt(n) { return Number(n || 0).toLocaleString(); }

async function loadData(showToast = false) {
  try {
    const res = await fetch(base + "/admin/usage", { headers: authHeaders() });
    if (res.status === 401) { toast("鉴权失败：请填写正确的 Proxy-Key", false); return; }
    if (!res.ok) { toast("加载失败：HTTP " + res.status, false); return; }
    const d = await res.json();
    if (!d.enabled) { toast("KV 未启用（需 Production 项目）", false); return; }

    document.getElementById("s-total").textContent = fmt(d.summary.total);
    document.getElementById("s-today").textContent = fmt(d.summary.today);
    document.getElementById("s-today-req").textContent = fmt(d.summary.today_requests) + " 请求";
    document.getElementById("s-req").textContent = fmt(d.summary.requests);

    // budget
    const b = d.budget;
    const pct = b.percent == null ? null : b.percent;
    const budgetEl = document.getElementById("s-budget");
    if (b.limit) {
      budgetEl.textContent = fmt(b.used) + " / " + fmt(b.limit);
      const fill = document.getElementById("budgetFill");
      fill.style.width = Math.min(pct, 100) + "%";
      fill.style.background = pct >= 100 ? "var(--danger)" : pct >= 80 ? "var(--warn)" : "var(--ok)";
      budgetEl.innerHTML += ` <span class="badge ${pct >= 100 ? "danger" : pct >= 80 ? "warn" : "ok"}">${pct}%</span>`;
    } else {
      budgetEl.textContent = "未设置";
    }

    // series chart (24h)
    const series = d.series_24h || [];
    const labels = series.map((s) => s.hour.slice(5, 13) + "h");
    const dataTok = series.map((s) => s.total_tokens);
    const dataReq = series.map((s) => s.requests);
    if (seriesChart) seriesChart.destroy();
    seriesChart = new Chart(document.getElementById("chartSeries"), {
      type: "bar",
      data: {
        labels,
        datasets: [
          { label: "Tokens", data: dataTok, backgroundColor: "rgba(108,140,255,.7)", yAxisID: "y", order: 2 },
          { label: "请求", type: "line", data: dataReq, borderColor: "#3ddc97", backgroundColor: "rgba(61,220,151,.2)", yAxisID: "y1", order: 1, tension: .3, pointRadius: 2 },
        ],
      },
      options: { responsive: true, interaction: { mode: "index", intersect: false },
        scales: { y: { beginAtZero: true, position: "left", grid: { color: "#262a36" } },
                  y1: { beginAtZero: true, position: "right", grid: { display: false } } },
        plugins: { legend: { labels: { color: "#e6e8ee" } } } },
    });

    // model chart
    const models = Object.entries(d.models || {}).sort((a, b) => b[1].total_tokens - a[1].total_tokens);
    if (modelChart) modelChart.destroy();
    modelChart = new Chart(document.getElementById("chartModel"), {
      type: "doughnut",
      data: {
        labels: models.map((m) => m[0]),
        datasets: [{ data: models.map((m) => m[1].total_tokens),
          backgroundColor: ["#6c8cff", "#3ddc97", "#ffb454", "#ff6b6b", "#a78bfa", "#f472b6"] }],
      },
      options: { responsive: true, plugins: { legend: { position: "right", labels: { color: "#e6e8ee", font: { size: 11 } } } } },
    });

    // tables
    const tbodyM = document.querySelector("#tblModel tbody");
    tbodyM.innerHTML = models.map(([name, v]) => `<tr><td>${name}</td><td>${fmt(v.requests)}</td><td>${fmt(v.total_tokens)}</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--muted)">暂无数据</td></tr>`;
    const providers = Object.entries(d.providers || {}).sort((a, b) => b[1].total_tokens - a[1].total_tokens);
    const tbodyP = document.querySelector("#tblProvider tbody");
    tbodyP.innerHTML = providers.map(([name, v]) => `<tr><td>${name}</td><td>${fmt(v.requests)}</td><td>${fmt(v.total_tokens)}</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--muted)">暂无数据</td></tr>`;

    if (showToast) toast("已刷新");
  } catch (e) {
    toast("请求出错：" + e.message, false);
  }
}

async function resetUsage() {
  if (!confirm("确认清零所有用量统计？此操作不可恢复。")) return;
  const res = await fetch(base + "/admin/usage/reset", { method: "POST", headers: authHeaders() });
  if (res.ok) { toast("已清零"); loadData(); } else toast("清零失败：HTTP " + res.status, false);
}

loadData();
setInterval(() => loadData(false), 30000); // auto-refresh every 30s
</script>
</body>
</html>
