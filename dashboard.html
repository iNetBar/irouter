<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iRouter 管理后台</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1d212c; --line:#2a2f3a;
  --txt:#e8eaed; --muted:#9aa0ac; --brand:#7c5cff; --brand2:#a78bfa;
  --ok:#34c759; --warn:#f5a623; --err:#ff453a; --info:#0a84ff;
  --grad:linear-gradient(135deg,#7c5cff 0%,#a78bfa 100%);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;}
a{color:var(--brand2);text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#333a47;border-radius:5px;}

/* ===== Layout ===== */
#app{display:flex;min-height:100vh;}
#sidebar{width:240px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{padding:20px 18px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;}
.nav{flex:1;padding:10px 8px;overflow:auto;}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;margin:2px 0;border-radius:10px;
  color:var(--muted);font-weight:500;transition:.15s;}
.nav a .ic{font-size:16px;width:20px;text-align:center;}
.nav a:hover{background:var(--panel2);color:var(--txt);}
.nav a.active{background:var(--grad);color:#fff;}
.side-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 22px;gap:16px;position:sticky;top:0;z-index:40;}
#topbar h1{font-size:16px;font-weight:600;}
#topbar .spacer{flex:1;}
#topbar .who{color:var(--muted);font-size:13px;}
#content{padding:22px;flex:1;max-width:1400px;width:100%;margin:0 auto;}

/* ===== Generic ===== */
.view{display:none;}
.view.active{display:block;}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.page-head h2{font-size:20px;}
.muted{color:var(--muted);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}

/* ===== Buttons (胶囊, 与路由规则页一致) ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:14px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap;}
.btn-primary{background:var(--grad);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-group{display:flex;align-items:center;line-height:1;vertical-align:middle;}
.btn-group .btn{border-radius:0;margin-left:-1px;}
.btn-group .btn:first-child{border-radius:14px 0 0 14px;margin-left:0;}
.btn-group .btn:last-child{border-radius:0 14px 14px 0;}
.btn-edit{background:var(--grad);color:#fff;}
.btn-delete{background:linear-gradient(135deg,#ff453a,#ff6b5b);color:#fff;}
.btn-test{background:linear-gradient(135deg,#0a84ff,#3da9ff);color:#fff;}

/* ===== Table ===== */
table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:11px 12px;vertical-align:middle;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
tbody tr:hover{background:rgba(255,255,255,.02);}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.tag-builtin{background:rgba(10,132,255,.16);color:#5ab0ff;}
.tag-custom{background:rgba(124,92,255,.18);color:var(--brand2);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.g{background:var(--ok);}
.dot.r{background:var(--err);}
.dot.y{background:var(--warn);}
code{font-family:"SF Mono",Consolas,monospace;background:var(--panel2);padding:2px 7px;border-radius:6px;font-size:12.5px;}

/* ===== Form ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;color:var(--muted);font-weight:500;}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;color:var(--txt);outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);}
.field .hint{font-size:12px;color:var(--muted);}
.full{grid-column:1/-1;}

/* ===== Toast ===== */
#toast-wrap{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:99999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;
  font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.45);pointer-events:auto;
  display:flex;align-items:center;gap:10px;min-width:280px;max-width:520px;animation:sl .2s;}
.toast.ok{border-left:4px solid var(--ok);}
.toast.err{border-left:4px solid var(--err);}
.toast.info{border-left:4px solid var(--info);}
.toast.warn{border-left:4px solid var(--warn);}
@keyframes sl{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

/* ===== Modal ===== */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:24px;}
.modal h3{font-size:18px;margin-bottom:16px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* ===== Dashboard ===== */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;}
.stat-card .ic{position:absolute;right:16px;top:16px;font-size:26px;opacity:.25;}
.stat-card .label{color:var(--muted);font-size:13px;margin-bottom:8px;}
.stat-card .val{font-size:30px;font-weight:700;}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px;}
.dash-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
.dash-row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.storage-banner{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.storage-banner.mem{border-color:var(--warn);background:rgba(245,166,35,.08);}
.req-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.req-item:last-child{border-bottom:none;}
.req-time{color:var(--muted);font-size:12px;width:64px;flex-shrink:0;}
.req-model{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.req-lat{color:var(--muted);font-size:12px;width:60px;text-align:right;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .big{font-size:44px;margin-bottom:10px;opacity:.6;}
.empty-state p{margin-bottom:14px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
.bar-label{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.bar-track{flex:1;background:var(--panel2);border-radius:6px;height:16px;overflow:hidden;}
.bar-fill{height:100%;background:var(--grad);border-radius:6px;transition:width .4s;}
.bar-val{width:48px;text-align:right;font-size:12px;color:var(--muted);flex-shrink:0;}
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.health-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;}
.health-card .hn{font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ring{display:flex;align-items:center;gap:10px;}
.ring .num{font-size:20px;font-weight:700;}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.quick-btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;
  text-align:center;transition:.15s;cursor:pointer;color:var(--txt);}
.quick-btn:hover{border-color:var(--brand);transform:translateY(-2px);}
.quick-btn .qi{font-size:26px;margin-bottom:8px;display:block;}
.guide-step{display:flex;gap:14px;margin-bottom:16px;}
.guide-num{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.guide-body h4{margin-bottom:4px;}
.guide-body p{color:var(--muted);font-size:13px;}
.guide-body code{display:block;margin-top:6px;padding:8px 10px;word-break:break-all;}

/* ===== Misc ===== */
.badge{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--muted);}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
@media(max-width:900px){
  #sidebar{width:64px;}
  .brand span,.nav a span:not(.ic),.side-foot{display:none;}
  .dash-grid,.quick-grid{grid-template-columns:repeat(2,1fr);}
  .dash-row,.dash-row-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">🛡</div><span>iRouter</span></div>
    <nav class="nav" id="nav">
      <a href="#dashboard" data-view="dashboard"><span class="ic">🏠</span><span>首页</span></a>
      <a href="#providers" data-view="providers"><span class="ic">📡</span><span>供应商</span></a>
      <a href="#routes" data-view="routes"><span class="ic">⚙️</span><span>路由规则</span></a>
      <a href="#keys" data-view="keys"><span class="ic">🔑</span><span>API Keys</span></a>
      <a href="#models" data-view="models"><span class="ic">🧩</span><span>模型管理</span></a>
      <a href="#settings" data-view="settings"><span class="ic">⚙️</span><span>系统设置</span></a>
    </nav>
    <div class="side-foot">v<span id="ver"></span> · <a href="#" id="helpLink">使用指南</a></div>
  </aside>

  <div id="main">
    <header id="topbar">
      <h1 id="pageTitle">管理首页</h1>
      <div class="spacer"></div>
      <span id="storageDot" class="badge">检查存储…</span>
      <span class="who" id="who"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
    </header>
    <div id="content"></div>
  </div>
</div>

<div id="toast-wrap"></div>

<!-- ===== Templates ===== -->
<template id="tpl-dashboard">
  <div class="view" id="view-dashboard">
    <div class="page-head"><h2>🏠 管理首页</h2>
      <span class="muted">数据每 30 秒自动刷新 · 最后更新 <span id="dashUpdated">-</span></span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn btn-ghost btn-sm" id="dashRefresh">🔄 刷新</button>
      <button class="btn btn-primary btn-sm" id="dashGuide">❔ 使用指南</button>
    </div>
    <div id="storageBanner"></div>
    <div class="dash-grid" id="statusCards"></div>
    <div class="dash-row">
      <div class="card"><h3>📈 最近请求</h3><div id="recentRequests"></div></div>
      <div class="card"><h3>🏆 模型调用排行</h3><div id="modelRanking"></div></div>
    </div>
    <div class="card"><h3>📡 供应商健康度</h3><div id="providerHealth" class="health-grid"></div></div>
    <div class="dash-row-2">
      <div class="card"><h3>⚡ 快速操作</h3>
        <div class="quick-grid">
          <div class="quick-btn" data-go="providers"><span class="qi">＋</span>添加供应商</div>
          <div class="quick-btn" data-go="routes"><span class="qi">＋</span>添加路由规则</div>
          <div class="quick-btn" data-go="keys"><span class="qi">🔑</span>配置 API Key</div>
          <div class="quick-btn" id="qRefresh"><span class="qi">🔄</span>刷新数据</div>
        </div>
      </div>
      <div class="card"><h3>ℹ️ 系统信息</h3>
        <table>
          <tbody>
            <tr><td>版本</td><td id="sysVer">-</td></tr>
            <tr><td>运行模式</td><td id="sysMode">-</td></tr>
            <tr><td>数据存储</td><td id="sysKV">-</td></tr>
            <tr><td>持久化</td><td id="sysPersist">-</td></tr>
            <tr><td>代理端点</td><td><code>POST /v1/chat/completions</code></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</template>

<template id="tpl-providers">
  <div class="view" id="view-providers">
    <div class="page-head"><h2>📡 供应商管理</h2>
      <div class="spacer" style="flex:1"></div>
      <button class="btn btn-primary btn-sm" id="addProvider">＋ 添加供应商</button></div>
    <div class="card"><table>
      <thead><tr><th>名称</th><th>标识</th><th>状态</th><th>类型</th><th>限额</th><th style="text-align:right">操作</th></tr></thead>
      <tbody id="providersBody"></tbody>
    </table></div>
  </div>
</template>

<template id="tpl-routes">
  <div class="view" id="view-routes">
    <div class="page-head"><h2>⚙️ 路由规则</h2>
      <span class="muted">按优先级从上到下匹配，命中即转发</span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn btn-primary btn-sm" id="addRoute">＋ 添加规则</button></div>
    <div class="card"><table>
      <thead><tr><th>优先级</th><th>匹配模式</th><th>供应商</th><th>兜底</th><th style="text-align:right">操作</th></tr></thead>
      <tbody id="routesBody"></tbody>
    </table></div>
  </div>
</template>

<template id="tpl-keys">
  <div class="view" id="view-keys">
    <div class="page-head"><h2>🔑 API Keys</h2>
      <div class="spacer" style="flex:1"></div>
      <select id="keyProvider" style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--txt)"></select>
      <button class="btn btn-primary btn-sm" id="addKey">＋ 添加 Key</button></div>
    <div class="card"><table>
      <thead><tr><th>Key</th><th>状态</th><th>失败次数</th><th style="text-align:right">操作</th></tr></thead>
      <tbody id="keysBody"></tbody>
    </table></div>
  </div>
</template>

<template id="tpl-models"><div class="view" id="view-models">
  <div class="page-head"><h2>🧩 模型管理</h2></div>
  <div class="card"><p class="muted">模型由供应商自动上报，无需手动添加。此处展示当前已发现的所有模型。</p>
    <div id="modelsList" class="row" style="margin-top:14px"></div></div>
</div></template>

<template id="tpl-settings"><div class="view" id="view-settings">
  <div class="page-head"><h2>⚙️ 系统设置</h2></div>
  <div class="card"><h3>代理配置</h3>
    <div class="form-grid">
      <div class="field"><label>Proxy Auth Key（客户端请求时 Bearer）</label>
        <input id="f-proxyKey" placeholder="留空则不校验客户端"></div>
      <div class="field"><label>请求超时（秒）</label>
        <input id="f-timeout" type="number" value="60"></div>
      <div class="field full"><label>允许的源（CORS，逗号分隔，* 为全部）</label>
        <input id="f-cors" placeholder="*"></div>
    </div>
    <button class="btn btn-primary" id="saveSettings">保存设置</button>
  </div>
</div></template>

<!-- Provider / Route / Key modals -->
<template id="tpl-provider-modal"><div class="modal-back" id="providerBack">
  <div class="modal"><h3 id="pmTitle">添加供应商</h3>
    <div class="field"><label>名称</label><input id="pf-name" placeholder="如 OpenAI"></div>
    <div class="field"><label>标识</label><input id="pf-id" placeholder="openai（唯一）"></div>
    <div class="field"><label>Base URL</label><input id="pf-base" placeholder="https://api.openai.com/v1"></div>
    <div class="field"><label>协议</label>
      <select id="pf-proto"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option><option value="gemini">Gemini</option></select></div>
    <div class="field"><label>类型</label>
      <select id="pf-type"><option value="builtin">内置</option><option value="custom">自建</option></select></div>
    <div class="field"><label>每分钟限额（RPM，0=不限）</label><input id="pf-rpm" type="number" value="0"></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="pmCancel">取消</button>
      <button class="btn btn-primary" id="pmSave">保存</button></div>
  </div>
</div></template>

<template id="tpl-route-modal"><div class="modal-back" id="routeBack">
  <div class="modal"><h3 id="rmTitle">添加路由规则</h3>
    <div class="field"><label>优先级（数字越小越先匹配）</label><input id="rf-prio" type="number" value="100"></div>
    <div class="field"><label>匹配模式</label><input id="rf-pattern" placeholder="如 gpt-5* 或 *（通配符）"></div>
    <div class="field"><label>供应商（按顺序尝试）</label>
      <select id="rf-providers" multiple style="height:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--txt)"></select></div>
    <div class="field"><label>兜底供应商（全部失败时）</label><select id="rf-fallback"></select></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="rmCancel">取消</button>
      <button class="btn btn-primary" id="rmSave">保存</button></div>
  </div>
</div></template>

<template id="tpl-key-modal"><div class="modal-back" id="keyBack">
  <div class="modal"><h3 id="kmTitle">添加 API Key</h3>
    <div class="field"><label>所属供应商</label><select id="kf-provider"></select></div>
    <div class="field"><label>API Key</label><input id="kf-key" placeholder="sk-..." type="password"></div>
    <div class="field"><label>备注</label><input id="kf-note" placeholder="可选"></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="kmCancel">取消</button>
      <button class="btn btn-primary" id="kmSave">保存</button></div>
  </div>
</div></template>

<!-- ===== Guide modal ===== -->
<template id="tpl-guide"><div class="modal-back" id="guideBack" style="z-index:200">
  <div class="modal" style="max-width:640px">
    <h3>🚀 iRouter 使用指南</h3>
    <p class="muted" style="margin-bottom:16px">照着 6 步走一遍，就能把你的 LLM 网关跑起来。</p>
    <div id="guideSteps"></div>
    <div class="modal-foot">
      <label style="margin-right:auto;color:var(--muted);font-size:13px">
        <input type="checkbox" id="guideDont"> 不再自动显示</label>
      <button class="btn btn-primary" id="guideClose">开始使用</button>
    </div>
  </div>
</template>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== API ===== */
let API_BASE = '';
async function api(method, path, body){
  const url = API_BASE + path;
  let res;
  try {
    res = await fetch(url, {
      method, credentials:'include',
      headers: body ? {'content-type':'application/json'} : {},
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch(e) {
    toast('❌ 网络错误：'+e.message,'err');
    throw e;
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : {}; } catch(_) { data = {error: text || res.statusText}; }
  if(!res.ok){
    const msg = (data && (data.error || data.message)) || ('HTTP '+res.status+' '+res.statusText);
    toast('❌ '+msg,'err');
    const err = new Error(msg); err.status = res.status; err.data = data; throw err;
  }
  return data;
}
const get = p => api('GET', p);

/* ===== Toast ===== */
function toast(msg, type='info', opts){
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'info');
  el.innerHTML = (type==='ok'?'✅ ':type==='err'?'❌ ':type==='warn'?'⚠️ ':'ℹ️ ') + esc(msg);
  $('#toast-wrap').appendChild(el);
  const ms = opts.center ? 4000 : 3000;
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),200); }, ms);
}

async function saveProvider(existing){
  const name=$('#pf-name').value.trim(), id=$('#pf-id').value.trim()||name.toLowerCase().replace(/\s+/g,'-'),
    base=$('#pf-base').value.trim(), proto=$('#pf-proto').value,
    isCustom=$('#pf-type').value==='custom', rpm=+$('#pf-rpm').value||0;
  if(!name){ toast('请填写名称','warn'); return; }
  if(existing){
    const b={...existing, name, baseUrl:base, protocol:proto, isCustom, rpm};
    try {
      const r = await put('/admin/api/providers/'+encodeURIComponent(existing.id), b);
      const i = PROVIDERS.findIndex(x=>x.id===existing.id);
      if(i>=0) PROVIDERS[i] = Object.assign({}, PROVIDERS[i], r && r.id ? r : b);
      else PROVIDERS.push(r && r.id ? r : b);
      renderProviders();
      toast('供应商已更新','ok');
      document.querySelector('.modal-back').remove();
    } catch(e){}
  } else {
    try {
      const r = await post('/admin/api/providers', {id,name,baseUrl:base,protocol:proto,isCustom,rpm,enabled:true});
      PROVIDERS.push(r && r.id ? r : {id,name,baseUrl:base,protocol:proto,isCustom,rpm,enabled:true});
      renderProviders();
      renderKeysProviders();
      toast('供应商已添加','ok');
      document.querySelector('.modal-back').remove();
    } catch(e){}
  }
}
function deleteProvider(id){
  if(!confirm('确定删除这家供应商？关联的 Key 也将失效。')) return;
  del('/admin/api/providers/'+encodeURIComponent(id)).then(()=>{
    const i = PROVIDERS.findIndex(x=>x.id===id); if(i>=0) PROVIDERS.splice(i,1);
    renderProviders();
    toast('已删除','ok');
  }).catch(()=>{});
}

let routeSeq = 0;
async function saveRoute(existing){
  const priority=+$('#rf-prio').value||100, pattern=$('#rf-pattern').value.trim()||'*',
    providers=[...$('#rf-providers').selectedOptions].map(o=>o.value),
    fallback=$('#rf-fallback').value;
  if(!providers.length){ toast('至少选一个供应商','warn'); return; }
  const b={priority, pattern, providers, fallback};
  if(existing){
    try {
      const r = await put('/admin/api/routes/'+encodeURIComponent(existing.id), b);
      const i = ROUTES.findIndex(x=>x.id===existing.id);
      const merged = Object.assign({}, existing, r && r.id ? r : b);
      if(i>=0) ROUTES[i] = merged; else ROUTES.push(merged);
      renderRoutes();
      toast('规则已更新','ok');
      document.querySelector('.modal-back').remove();
    } catch(e){}
  } else {
    try {
      const r = await post('/admin/api/routes', Object.assign({id:'r_'+(Date.now().toString(36))+'_'+(routeSeq++)}, b));
      ROUTES.push(r && r.id ? r : Object.assign({id:'tmp_'+Date.now()}, b));
      renderRoutes();
      toast('规则已添加','ok');
      document.querySelector('.modal-back').remove();
    } catch(e){}
  }
}
function deleteRoute(id){

  del('/admin/api/routes/'+encodeURIComponent(id)).then(()=>{

    renderRoutes();

  }).catch(()=>{});
}

async function saveKey(pid, existing){
  const providerId = pid || currentKeyProviderId;
  const key = $('#kf-key').value.trim();
  const note = $('#kf-note').value.trim();
  if(!providerId){ toast('请先选择供应商','warn'); return; }
  if(!existing && !key){ toast('请填写 API Key','warn'); return; }
  const b = existing ? {note, enabled:existing.enabled!==false} : {key, note};
  try {
    const r = existing
      ? await put('/admin/api/providers/'+encodeURIComponent(providerId)+'/keys/'+encodeURIComponent(existing.id), b)
      : await post('/admin/api/providers/'+encodeURIComponent(providerId)+'/keys', b);
    const saved = r && r.id ? r : Object.assign({id:'tmp_'+Date.now(), providerId, key, note, enabled:true, failCount:0}, b);
    const i = KEYS.findIndex(x=>x.id===(existing?existing.id:saved.id) && x.providerId===providerId);
    if(i>=0) KEYS[i] = Object.assign({}, KEYS[i], saved);
    else KEYS.push(saved);
    renderKeys();
    toast('Key 已保存','ok');
    document.querySelector('.modal-back').remove();
  } catch(e){}
}
function deleteKey(pid, keyId){
  if(!confirm('确定删除这个 Key？')) return;
  del('/admin/api/providers/'+encodeURIComponent(pid)+'/keys/'+encodeURIComponent(keyId)).then(()=>{
    const i = KEYS.findIndex(x=>x.id===keyId && x.providerId===pid); if(i>=0) KEYS.splice(i,1);
    renderKeys();
    toast('已删除','ok');
  }).catch(()=>{});
}
function recoverKey(pid, keyId){
  const k = KEYS.find(x=>x.id===keyId && x.providerId===pid); if(k) k.failCount=0;
  put('/admin/api/providers/'+encodeURIComponent(pid)+'/keys/'+encodeURIComponent(keyId), {failCount:0}).then(()=>{
    renderKeys(); toast('已恢复','ok');
  }).catch(()=>{});
}

/* ===== ===== ===== Models / Settings ===== ===== ===== */
function renderModels(){
  const models = uniq([].concat(...PROVIDERS.map(p=>p.models||[])));
  $('#modelsList').innerHTML = models.length ? models.map(m=>`<div class="card" style="margin:0;flex:1 1 220px"><code>${esc(m)}</code></div>`).join('')
    : `<div class="empty-state"><div class="big">🧩</div><p>暂无模型，添加供应商后自动发现</p></div>`;
}
function renderSettings(){
  get('/admin/api/config').then(c=>{
    if(c){
      if(c.proxyKey!==undefined) $('#f-proxyKey').value=c.proxyKey||'';
      if(c.timeout) $('#f-timeout').value=c.timeout;
      if(c.cors) $('#f-cors').value=c.cors;
    }
  }).catch(()=>{});
}
$('#saveSettings').onclick = ()=>{
  const b={ proxyKey:$('#f-proxyKey').value.trim(), timeout:+$('#f-timeout').value||60, cors:$('#f-cors').value.trim()||'*' };
  put('/admin/api/config', b).then(()=>toast('设置已保存','ok')).catch(()=>{});
};

/* ===== ===== ===== View routing ===== ===== ===== */
const TITLES = { dashboard:'管理首页', providers:'供应商管理', routes:'路由规则', keys:'API Keys', models:'模型管理', settings:'系统设置' };
const RENDERERS = {
  dashboard: ()=>{ renderDashboard(); startDashboardAutoRefresh(); },
  providers: ()=>{ renderProviders(); renderRoutesProviders(); renderKeysProviders(); },
  routes: ()=>renderRoutes(),
  keys: ()=>renderKeys(),
  models: ()=>renderModels(),
  settings: ()=>renderSettings(),
};
function mount(view){
  const tpl = $('#tpl-'+view);
  const content = $('#content');
  if(!content.querySelector('#view-'+view) && tpl){
    content.insertAdjacentHTML('beforeend', tpl.innerHTML);
  }
  $$('.view').forEach(v=>v.classList.remove('active'));
  const el = $('#view-'+view);
  if(el) el.classList.add('active');
}
function navigate(view){
  if(!RENDERERS[view]) view='dashboard';
  currentView = view;
  mount(view);
  (RENDERERS[view] || RENDERERS.dashboard)();
  $('#pageTitle').textContent = TITLES[view] || '管理后台';
  $$('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.view===view));
  if(location.hash!=='#'+view) history.replaceState(null,'','#'+view);
  if(view!=='dashboard' && dashboardTimer){ clearInterval(dashboardTimer); dashboardTimer=null; }
}
function initRoutes(){
  $$('#nav a').forEach(a=>a.onclick = e=>{ e.preventDefault(); navigate(a.dataset.view); window.scrollTo(0,0); });
  $$('.quick-btn[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));
  $('#qRefresh').onclick = ()=>{ fetchDashboard(); toast('已刷新','ok'); };
  $('#dashRefresh').onclick = ()=>fetchDashboard();
  $('#dashGuide').onclick = showGuide;
  $('#helpLink').onclick = e=>{ e.preventDefault(); showGuide(); };
  $('#logoutBtn').onclick = ()=>{ del('/admin/api/logout').then(()=>location.href='/admin/login').catch(()=>location.href='/admin/login'); };
  document.addEventListener('click', e=>{
    const btn = e.target.closest('[data-action]'); if(!btn) return;
    const action = btn.dataset.action, id = btn.dataset.id, pid = btn.dataset.pid;
    if(action==='edit-provider') openProvider(id);
    else if(action==='delete-provider') deleteProvider(id);
    else if(action==='edit-route') openRoute(id);
    else if(action==='delete-route') deleteRoute(id);
    else if(action==='edit-key') openKey(pid, id);
    else if(action==='delete-key') deleteKey(pid, id);
    else if(action==='recover-key') recoverKey(pid, id);
  });
  $('#keyProvider').addEventListener('change', e=>{ currentKeyProviderId = e.target.value; renderKeys(); });
}

/* ===== ===== ===== Init ===== ===== ===== */
async function init(){
  const v = (window.VERSION)||'2.5.1';
  const verEl = $('#ver'); if(verEl) verEl.textContent = v;
  initRoutes();
  await checkStorage();
  // 拉取初始数据（先本地，再同步）
  try { const ps = await get('/admin/api/providers'); if(Array.isArray(ps)){ PROVIDERS.length=0; PROVIDERS.push(...ps); } } catch(e){}
  try { const rs = await get('/admin/api/routes'); if(Array.isArray(rs)){ ROUTES.length=0; ROUTES.push(...rs); } } catch(e){}
  try { const cfg = await get('/admin/api/config'); if(cfg && cfg.providers){ PROVIDERS.length=0; PROVIDERS.push(...cfg.providers); } } catch(e){}
  const hash = (location.hash||'#dashboard').slice(1);
  navigate(/^[a-z]+$/.test(hash) ? hash : 'dashboard');
  renderProviders();
  renderRoutes();
  maybeShowGuide();
}
init();
</script>
