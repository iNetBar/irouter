<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>irouter · LLM 网关</title>
<style>
/* ============ 主题变量 ============ */
:root,
[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a21;--line:#262b36;--txt:#e6e6e6;--muted:#8b93a7;
  --brand:#7c9cff;--ok:#3ddc97;--warn:#ffb454;--bad:#ff6b6b;--chip:#20252f;
  --nav-bg:#171a21;--nav-hover:#20252f;--input-bg:#0f1218;
}
[data-theme="light"]{
  --bg:#f5f6f8;--panel:#ffffff;--line:#e3e6ec;--txt:#1a1d24;--muted:#6b7280;
  --brand:#4f74e8;--ok:#12a16a;--warn:#d98212;--bad:#e04545;--chip:#eef0f4;
  --nav-bg:#ffffff;--nav-hover:#f0f2f6;--input-bg:#fafbfc;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:7px 13px;background:var(--chip);color:var(--txt)}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--brand);color:#0b0f1a;font-weight:600}
button.danger{background:var(--bad);color:#fff}
/* 表格操作按钮：统一尺寸，编辑/删除等大 */
table .btn{height:30px;min-width:52px;padding:4px 12px;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
table .btn + .btn{margin-left:6px}
@media(max-width:720px){
 table .btn{height:32px;min-width:48px;padding:5px 10px}
}
input,select,textarea{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--input-bg);color:var(--txt);width:100%;max-width:420px}
input:focus,select,textarea:focus{outline:none;border-color:var(--brand)}
label{display:block;margin:10px 0 4px;color:var(--muted)}
.side{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--nav-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transform:translateX(0);transition:transform .2s}
.side .brand{padding:18px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
.side .brand small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
.nav{flex:1;padding:8px}
.nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;margin:2px 0}
.nav a:hover{background:var(--nav-hover);color:var(--txt)}
.nav a.active{background:var(--brand);color:#fff;font-weight:600}
.side .foot{padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.main{margin-left:220px;min-height:100vh}
.header{position:sticky;top:0;background:rgba(127,127,127,.15);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:20}
.burger{display:none;flex-direction:column;gap:4px;padding:6px;background:transparent}
.burger span{width:20px;height:2px;background:var(--txt);border-radius:2px;display:block}
.header h1{font-size:15px;margin:0;font-weight:600;flex:1}
.header .clock{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.theme-btn{background:var(--chip);border-radius:50%;width:34px;height:34px;padding:0;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;margin-left:auto}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
.scrim.on{display:block}
.wrap{padding:16px;max-width:1200px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;background:var(--nav-hover)}
tbody tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.g{background:var(--ok)}.r{background:var(--bad)}.y{background:var(--warn)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:11px;margin:1px}
.tag.on{background:var(--brand);color:#0b0f1a}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .card{width:100%;max-width:560px;margin:0}
.modal .x{float:right;background:transparent;color:var(--muted);font-size:18px;padding:0 4px}
.alert{background:rgba(255,180,84,.12);border:1px solid var(--warn);color:var(--warn);padding:10px 12px;border-radius:8px;margin-bottom:12px;display:none}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:160px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--brand)}
@media(max-width:720px){
 .burger{display:flex}
 .side{transform:translateX(-100%);width:200px}
 .side.on{transform:translateX(0)}
 .main{margin-left:0}
 .header h1{font-size:14px}
 table{font-size:12px}
 th,td{padding:6px 5px}
 input,select,textarea{max-width:100%}
 .wrap{padding:12px}
}
@media(max-width:480px){
 .header .clock{display:none}
 .card{padding:12px}
}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<!-- ================= 登录页（默认隐藏，JS 校验 session 后决定是否显示） ================= -->
<div id="login-page" style="position:fixed;inset:0;z-index:200;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px">
 <form id="login-form" class="card" style="width:100%;max-width:360px;margin:0;box-shadow:0 12px 40px rgba(0,0,0,.35)" onsubmit="return false">
  <div style="text-align:center;margin-bottom:16px">
   <div style="font-size:26px">⚡</div>
   <h2 style="margin:4px 0 2px;font-size:17px">irouter 管理后台</h2>
   <div class="muted" style="font-size:12px">LLM 聚合网关 · v{{VERSION}}</div>
  </div>
  <label>用户名</label>
  <input id="login_user" type="text" autocomplete="username" value="admin" required>
  <label>密码</label>
  <input id="login_pass" type="password" autocomplete="current-password" placeholder="默认密码 admin123" required>
  <div id="login_err" class="alert" style="display:none;margin-top:12px"></div>
  <button id="login_btn" class="primary" style="width:100%;margin-top:14px;padding:10px;font-size:14px">登 录</button>
  <p class="muted" style="font-size:11px;text-align:center;margin-top:14px;line-height:1.6">
   首次登录请使用默认密码 <b>admin123</b><br>登录后请在左下角「修改密码」
  </p>
 </form>
</div>

<!-- ================= 修改密码弹窗 ================= -->
<div class="modal" id="changePassModal">
 <div class="card" style="max-width:400px;width:100%;margin:0">
  <h2 style="margin:0 0 12px">修改后台密码</h2>
  <label>原密码</label>
  <input id="cp_old" type="password" autocomplete="current-password">
  <label>新密码（至少 6 位）</label>
  <input id="cp_new" type="password" autocomplete="new-password">
  <div id="cp_err" class="alert" style="display:none;margin-top:10px"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end">
   <button onclick="closeChangePass()">取消</button>
   <button class="primary" onclick="submitChangePass()">确认修改</button>
  </div>
 </div>
</div>

<aside class="side" id="side">
 <div class="brand">⚡ irouter<small>LLM 聚合网关 v{{VERSION}}</small></div>
 <nav class="nav" id="nav">
  <a href="#providers" data-tab="providers" class="active">📡 供应商</a>
  <a href="#keys" data-tab="keys">🔑 Keys</a>
  <a href="#latency" data-tab="latency">📊 延迟</a>
  <a href="#usage" data-tab="usage">💰 用量</a>
  <a href="#logs" data-tab="logs">📋 日志</a>
  <a href="#routes" data-tab="routes">⚙️ 路由规则</a>
 </nav>
 <div class="foot" style="display:flex;flex-direction:column;gap:6px">
   <button onclick="openChangePass()" style="width:100%;text-align:left">🔒 修改密码</button>
   <button onclick="logout()" style="width:100%;text-align:left">🚪 退出登录</button>
 </div>
</aside>

<div class="main">
 <div class="header">
  <button class="burger" id="burger" aria-label="菜单"><span></span><span></span><span></span></button>
  <h1 id="pageTitle">供应商</h1>
  <span class="clock" id="clock"></span>
  <button id="themeBtn" class="theme-btn" title="切换亮色/暗色" aria-label="切换主题">🌙</button>
 </div>
 <div class="wrap" id="view"></div>
</div>

<div class="modal" id="modal"><div class="card"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>

<script>
// ---------- 全局工具（全部显式挂到 window，杜绝 "is not defined"） ----------
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };

window.closeModal = function(){ $('#modal').classList.remove('on'); };

window.toast = function(msg, kind){
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--txt);padding:9px 16px;border-radius:8px;z-index:99;font-size:13px;border:1px solid '+ (kind==='err'?'var(--bad)':'var(--brand)');
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 2400);
};

window.api = function(path, opts){
  opts = opts || {};
  return fetch('/admin/api' + path, {
    method: opts.method || 'GET',
    headers: opts.body ? {'Content-Type':'application/json'} : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(!r.ok) return r.json().then(function(e){ throw new Error(e.error || ('HTTP '+r.status)); }, function(){ throw new Error('HTTP '+r.status); });
    return r.json();
  });
};

window.confirmDanger = function(msg){
  return new Promise(function(res){ res(window.confirm(msg)); });
};

// ---------- 汉堡菜单（三道杠）：事件绑定，不用 onclick ----------
function initBurger(){
  var burger = $('#burger'), side = $('#side'), scrim = $('#scrim');
  if(!burger) return;
  burger.addEventListener('click', function(){
    side.classList.add('on');
    scrim.classList.add('on');
  });
  scrim.addEventListener('click', function(){
    side.classList.remove('on');
    scrim.classList.remove('on');
  });
}

// ---------- 菜单点击：事件委托（不依赖任何 onclick 函数） ----------
function initNav(){
  var nav = $('#nav');
  if(!nav) return;
  nav.addEventListener('click', function(e){
    var link = e.target.closest('a[data-tab]');
    if(!link) return;
    e.preventDefault();
    var tab = link.dataset.tab;
    // 移动端点击后自动收起侧栏
    $('#side').classList.remove('on');
    $('#scrim').classList.remove('on');
    // 高亮
    nav.querySelectorAll('a').forEach(function(a){ a.classList.remove('active'); });
    link.classList.add('active');
    // 切换内容
    if(window.loadTab) window.loadTab(tab);
    // 更新 URL hash（不触发跳转）
    if(history.replaceState) history.replaceState(null, '', '#'+tab);
  });
}

// ---------- 表格操作按钮：事件委托（data-action / data-id，根除"点击无反应"）----------
function initTableActions(){
  // 用事件委托绑定到 #view，任何动态渲染的行都生效（编辑/删除按钮）
  var view = $('#view');
  if(!view) return;
  view.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn || btn.disabled) return;
    var action = btn.dataset.action;
    var id = btn.dataset.id;
    if(!id) return;
    if(action === 'edit'){ window.openProvider(id); }
    else if(action === 'delete'){ window.deleteProvider(id); }
  });
}

// ---------- 主题切换（亮色 / 暗色）----------
window.applyTheme = function(theme){
  document.documentElement.setAttribute('data-theme', theme);
  var btn = $('#themeBtn');
  if(btn) btn.textContent = (theme==='light') ? '🌙' : '☀️';
  try { localStorage.setItem('irouter_theme', theme); } catch(e){}
};

window.toggleTheme = function(){
  var cur = document.documentElement.getAttribute('data-theme') || 'dark';
  window.applyTheme(cur==='light' ? 'dark' : 'light');
};

function initTheme(){
  var saved = null;
  try { saved = localStorage.getItem('irouter_theme'); } catch(e){}
  // 优先级：用户保存 > 系统偏好 > 默认暗色
  var theme = saved || (window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  window.applyTheme(theme);
  var btn = $('#themeBtn');
  if(btn) btn.addEventListener('click', window.toggleTheme);
  // 系统主题变化自动跟随（仅当用户未手动设置时生效）
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e){
      var s = null; try { s = localStorage.getItem('irouter_theme'); } catch(err){}
      if(!s) window.applyTheme(e.matches ? 'light' : 'dark');
    });
  }
};

// ---------- 时钟 ----------
function tickClock(){
  var el = $('#clock');
  if(!el) return;
  var d = new Date();
  var p = function(n){ return (n<10?'0':'')+n; };
  el.textContent = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

// ---------- Tab 路由 ----------
var TITLES = {
  providers:'供应商', keys:'Keys', latency:'延迟',
  usage:'用量', logs:'日志', routes:'路由规则'
};

window.loadTab = function(tab){
  tab = tab || 'providers';
  $('#pageTitle').textContent = TITLES[tab] || tab;
  var fn = window['render_'+tab];
  if(typeof fn === 'function'){
    try { fn(); } catch(err){ $('#view').innerHTML = '<div class="alert" style="display:block">渲染错误：'+esc(err.message)+'</div>'; console.error(err); }
  } else {
    $('#view').innerHTML = '<div class="card"><h2>'+esc(TITLES[tab]||tab)+'</h2><p class="muted">该模块尚未实现。</p></div>';
  }
};

// ===================================================================
// 供应商
// ===================================================================
window.render_providers = function(){
  $('#view').innerHTML = '<div class="card"><h2>供应商</h2><p class="muted">加载中…</p></div>';
  window.api('/providers').then(function(list){
    var builtinCount = 0, customCount = 0;
    (list||[]).forEach(function(p){ if(p.builtin) builtinCount++; else customCount++; });
    var html = '';
    html += '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px">';
    html += '<div><h2 style="display:inline">供应商</h2> <span class="muted">内置 '+builtinCount+' · 自建 '+customCount+'</span></div>';
    html += '<div class="row"><button class="primary" onclick="openProvider()">＋ 添加供应商</button> <button onclick="window.resetBuiltin()">＋ 恢复内置供应商</button></div>';
    html += '</div>';
    html += '<div style="overflow-x:auto"><table><thead><tr>';
    html += '<th>状态</th><th>名称</th><th>协议</th><th>模型</th><th>Keys</th><th>健康</th><th>类型</th><th></th>';
    html += '</tr></thead><tbody>';
    (list||[]).forEach(function(p){
      html += '<tr>';
      html += '<td><span class="dot '+(p.enabled?'g':'r')+'"></span></td>';
      html += '<td><b>'+esc(p.name)+'</b><br><small class="muted">'+esc(p.id)+'</small></td>';
      html += '<td><span class="tag">'+esc(p.protocol||'openai')+'</span></td>';
      html += '<td class="muted" style="font-size:12px">'+esc((p.models||[]).slice(0,2).join(', '))+(p.models&&p.models.length>2?'…':'')+'</td>';
      html += '<td>'+(p.keys?(p.keys.filter(function(k){return k.enabled;}).length+'/'+p.keys.length):'0')+'</td>';
      html += '<td class="muted">-</td>';
      html += '<td><span class="tag '+(p.builtin?'':'on')+'>'+(p.builtin?'内置':'自建')+'</span></td>';
      html += '<td class="row-actions" style="white-space:nowrap">';
      html += '<button class="btn" data-action="edit" data-id="'+esc(p.id)+'">编辑</button>';
      if(!p.builtin) html += '<button class="btn danger" data-action="delete" data-id="'+esc(p.id)+'">删除</button>';
      html += '</td></tr>';
    });
    html += '</tbody></table></div></div>';
    $('#view').innerHTML = html;
  }).catch(function(err){
    $('#view').innerHTML = '<div class="card"><div class="alert" style="display:block">加载失败：'+esc(err.message)+'</div>'+
      '<button class="primary" onclick="window.resetBuiltin()">＋ 恢复内置供应商</button></div>';
  });
};

window.openProvider = function(id){
  var isEdit = !!id;
  window.api('/providers'+(id?'/'+encodeURIComponent(id):'')).then(function(p){
    p = p || {id:'',name:'',protocol:'openai',baseUrl:'',models:[],enabled:true,builtin:false};
    $('#modalBody').innerHTML = '' +
      '<h2>'+ (isEdit?'编辑':'添加') +'供应商</h2>'+
      '<label>ID（唯一，如 deepseek）</label><input id="f_id" value="'+esc(p.id)+'" '+(isEdit?'readonly':'')+'>'+
      '<label>名称</label><input id="f_name" value="'+esc(p.name)+'">'+
      '<label>协议</label><select id="f_protocol"><option value="openai">openai</option><option value="anthropic">anthropic</option><option value="google">google</option><option value="glm">glm</option></select>'+
      '<label>Base URL</label><input id="f_base" placeholder="https://api.deepseek.com/v1" value="'+esc(p.baseUrl||'')+'">'+
      '<label>模型（逗号分隔）</label><input id="f_models" value="'+esc((p.models||[]).join(','))+'">'+
      '<label><input type="checkbox" id="f_enabled" '+(p.enabled?'checked':'')+'> 启用</label>'+
      '<div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="closeModal()">取消</button> <button class="primary" onclick="saveProvider(\''+esc(id||'')+'\')">保存</button></div>';
    $('#f_protocol').value = p.protocol || 'openai';
    $('#modal').classList.add('on');
  }).catch(function(err){ window.toast(err.message, 'err'); });
};

window.editProvider = function(id){ window.openProvider(id); };

window.saveProvider = function(id){
  var data = {
    id: $('#f_id').value.trim(),
    name: $('#f_name').value.trim(),
    protocol: $('#f_protocol').value,
    baseUrl: $('#f_base').value.trim(),
    models: $('#f_models').value.split(/[,，\n]/).map(function(s){return s.trim();}).filter(Boolean),
    enabled: $('#f_enabled').checked,
    isCustom: true   // ★ 自建供应商标记：确保 list() 里 builtin=false，从而显示删除按钮
  };
  if(!data.id || !data.name){ window.toast('ID 和名称必填','err'); return; }
  var method = id ? 'PUT' : 'POST';
  var path = '/providers' + (id ? '/'+encodeURIComponent(id) : '');
  window.api(path, {method:method, body:data}).then(function(){
    window.toast('已保存'); closeModal(); window.render_providers();
  }).catch(function(err){ window.toast('保存失败：'+err.message,'err'); console.error(err); });
};

window.deleteProvider = function(id){
  window.confirmDanger('确定删除供应商 '+id+' ？').then(function(ok){
    if(!ok) return;
    window.api('/providers/'+encodeURIComponent(id), {method:'DELETE'}).then(function(){
      window.toast('已删除'); window.render_providers();
    }).catch(function(err){ window.toast(err.message,'err'); });
  });
};

// ★ 关键：显式挂到 window，且用完整的 fetch + 错误提示
window.resetBuiltin = function(){
  window.toast('正在恢复内置供应商…');
  window.api('/providers/reset-builtin', {method:'POST'}).then(function(res){
    window.toast('已恢复：'+ (res.restored||0) +' 个内置供应商');
    window.render_providers();
  }).catch(function(err){
    window.toast('恢复失败：'+err.message, 'err');
    console.error('reset-builtin error:', err);
  });
};

// ===================================================================
// Keys
// ===================================================================
window.render_keys = function(){
  window.api('/providers').then(function(list){
    var opts = '<option value="">（无）</option>';
    (list||[]).forEach(function(p){ opts += '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'; });
    $('#view').innerHTML = '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="display:inline">Keys</h2><button class="primary" onclick="openKey(\'\',\''+esc((list&&list[0]&&list[0].id)||'')+'\')">＋ 添加 Key</button></div>'+
      '<label>选择供应商</label><select id="keyProvider" onchange="render_keys_list()">'+opts+'</select>'+
      '<div id="keyList" style="margin-top:12px"></div></div>';
    if(list && list[0]){ $('#keyProvider').value = list[0].id; }
    window.render_keys_list();
  }).catch(function(err){ $('#view').innerHTML = '<div class="alert" style="display:block">加载失败：'+esc(err.message)+'</div>'; });
};

window.render_keys_list = function(){
  var pid = $('#keyProvider').value;
  if(!pid){ $('#keyList').innerHTML = '<p class="muted">请先选择供应商。</p>'; return; }
  window.api('/providers/'+encodeURIComponent(pid)+'/keys').then(function(keys){
    var html = '<div style="overflow-x:auto"><table><thead><tr><th>状态</th><th>Key（脱敏）</th><th>权重</th><th>失败</th><th></th></tr></thead><tbody>';
    (keys||[]).forEach(function(k){
      html += '<tr><td><span class="dot '+(k.enabled?'g':'r')+'"></span></td><td><code>'+esc(k.key||'(未设置)')+'</code></td><td>'+esc(k.weight||1)+'</td><td>'+(k.failCount||0)+'</td>';
      html += '<td><button onclick="testKey(\''+esc(pid)+'\',\''+esc(k.id)+'\')">测试</button> ';
      if(k.failCount>0) html += '<button onclick="recoverKey(\''+esc(pid)+'\',\''+esc(k.id)+'\')">恢复</button> ';
      html += '<button class="danger" onclick="deleteKey(\''+esc(pid)+'\',\''+esc(k.id)+'\')">删除</button></td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<button class="primary" style="margin-top:10px" onclick="openKey(\''+esc(pid)+'\')">＋ 添加 Key</button>';
    $('#keyList').innerHTML = html;
  }).catch(function(err){ $('#keyList').innerHTML = '<div class="alert" style="display:block">'+esc(err.message)+'</div>'; });
};

window.openKey = function(pid, keyId){
  var k = keyId ? null : {key:'',weight:1,enabled:true};
  if(keyId){
    // 编辑已有 key：直接从列表定位（简化，直接填）
  }
  $('#modalBody').innerHTML = '' +
    '<h2>'+(keyId?'编辑':'添加')+' Key</h2>'+
    '<label>供应商</label><input id="k_pid" value="'+esc(pid||$('#keyProvider').value||'')+'" readonly>'+
    '<label>Key</label><input id="k_key" placeholder="sk-..." value="'+esc((k&&k.key)||'')+'">'+
    '<label>权重</label><input id="k_weight" type="number" min="1" value="'+esc((k&&k.weight)||1)+'">'+
    '<label><input type="checkbox" id="k_enabled" '+(k&&k.enabled?'checked':'')+'> 启用</label>'+
    '<div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="closeModal()">取消</button> <button class="primary" onclick="saveKey(\''+esc(pid||'')+'\',\''+esc(keyId||'')+'\')">保存</button></div>';
  $('#modal').classList.add('on');
};

window.saveKey = function(pid, keyId){
  pid = pid || $('#k_pid').value;
  var body = {key:$('#k_key').value.trim(), weight:parseInt($('#k_weight').value)||1, enabled:$('#k_enabled').checked};
  var method = keyId ? 'PUT' : 'POST';
  var path = '/providers/'+encodeURIComponent(pid)+'/keys'+(keyId?'/'+encodeURIComponent(keyId):'');
  window.api(path, {method:method, body:body}).then(function(){ window.toast('已保存'); closeModal(); window.render_keys_list(); }).catch(function(err){ window.toast(err.message,'err'); });
};

window.testKey = function(pid, keyId){
  window.api('/providers/'+encodeURIComponent(pid)+'/keys/'+encodeURIComponent(keyId)+'/test', {method:'POST'}).then(function(r){
    window.toast(r.ok?'✓ '+ (r.latency||0)+'ms':'✗ 失败', r.ok?'':'err'); window.render_keys_list();
  }).catch(function(err){ window.toast(err.message,'err'); });
};

window.recoverKey = function(pid, keyId){
  window.api('/providers/'+encodeURIComponent(pid)+'/keys/'+encodeURIComponent(keyId)+'/recover', {method:'POST'}).then(function(){ window.toast('已恢复'); window.render_keys_list(); }).catch(function(err){ window.toast(err.message,'err'); });
};

window.deleteKey = function(pid, keyId){
  window.confirmDanger('确定删除该 Key？').then(function(ok){
    if(!ok) return;
    window.api('/providers/'+encodeURIComponent(pid)+'/keys/'+encodeURIComponent(keyId), {method:'DELETE'}).then(function(){ window.toast('已删除'); window.render_keys_list(); }).catch(function(err){ window.toast(err.message,'err'); });
  });
};

// ===================================================================
// 延迟 / 用量 / 日志 / 路由规则（占位 + 基础展示）
// ===================================================================
window.render_latency = function(){
  window.api('/stats/latency').then(function(d){
    var rows = '';
    var data = (d&&d.providers)||{};
    Object.keys(data).forEach(function(pid){
      var s = data[pid]||{};
      rows += '<tr><td>'+esc(pid)+'</td><td>'+(s.count||0)+'</td><td>'+(s.p50||0)+'</td><td>'+(s.p95||0)+'</td><td>'+(s.avg||0)+'</td></tr>';
    });
    $('#view').innerHTML = '<div class="card"><h2>延迟统计（P50 / P95，单位 ms）</h2>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>供应商</th><th>样本</th><th>P50</th><th>P95</th><th>平均</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="muted">暂无数据，发几条请求后会自动统计。</td></tr>')+'</tbody></table></div></div>';
  }).catch(function(err){ $('#view').innerHTML = '<div class="alert" style="display:block">'+esc(err.message)+'</div>'; });
};

window.render_usage = function(){
  window.api('/stats/usage').then(function(d){
    var rows = '';
    var data = (d&&d.byProvider)||{};
    Object.keys(data).forEach(function(pid){
      var u = data[pid]||{};
      rows += '<tr><td>'+esc(pid)+'</td><td>'+(u.input||0)+'</td><td>'+(u.output||0)+'</td><td>'+(u.total||0)+'</td></tr>';
    });
    $('#view').innerHTML = '<div class="card"><h2>Token 用量（今日）</h2>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>供应商</th><th>Input</th><th>Output</th><th>合计</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="muted">暂无数据。</td></tr>')+'</tbody></table></div></div>';
  }).catch(function(err){ $('#view').innerHTML = '<div class="alert" style="display:block">'+esc(err.message)+'</div>'; });
};

window.render_logs = function(){
  window.api('/logs?limit=100').then(function(d){
    var rows = '';
    (d&&d.logs||[]).forEach(function(l){
      rows += '<tr><td>'+esc(l.time||'')+'</td><td>'+esc(l.method||'')+'</td><td>'+esc(l.model||'')+'</td><td>'+esc(l.provider||'')+'</td><td>'+(l.status||'')+'</td><td>'+(l.latency||0)+'ms</td></tr>';
    });
    $('#view').innerHTML = '<div class="card"><h2>最近请求日志</h2>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>时间</th><th>方法</th><th>模型</th><th>供应商</th><th>状态</th><th>延迟</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="muted">暂无请求。</td></tr>')+'</tbody></table></div></div>';
  }).catch(function(err){ $('#view').innerHTML = '<div class="alert" style="display:block">'+esc(err.message)+'</div>'; });
};

window.render_routes = function(){
  window.api('/routes').then(function(d){
    var rules = (d&&d.rules)||[];
    var rows = '';
    rules.forEach(function(r, i){
      rows += '<tr><td>'+esc(r.pattern||'')+'</td><td>'+esc((r.providers||[]).join(' → '))+'</td><td><button class="danger" onclick="deleteRoute('+i+')">删除</button></td></tr>';
    });
    $('#view').innerHTML = '<div class="card"><h2>路由规则</h2>'+
      '<p class="muted">按模型名匹配，优先走列表靠前的供应商，全部不可用时自动 fallback。</p>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>匹配（支持 * 通配）</th><th>供应商优先级</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="3" class="muted">暂无自定义规则，走默认轮询。</td></tr>')+'</tbody></table></div>'+
      '<div class="row" style="margin-top:12px"><input id="r_pattern" placeholder="*gpt*, deepseek-chat" style="max-width:240px"><input id="r_providers" placeholder="deepseek, openrouter" style="max-width:280px"><button class="primary" onclick="addRoute()">＋ 添加规则</button></div></div>';
  }).catch(function(err){ $('#view').innerHTML = '<div class="alert" style="display:block">'+esc(err.message)+'</div>'; });
};

window.addRoute = function(){
  var pat = $('#r_pattern').value.trim();
  var provs = $('#r_providers').value.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
  if(!pat || !provs.length){ window.toast('请填写匹配规则和供应商','err'); return; }
  window.api('/routes', {method:'POST', body:{pattern:pat, providers:provs}}).then(function(){ window.toast('已添加'); window.render_routes(); }).catch(function(err){ window.toast(err.message,'err'); });
};

window.deleteRoute = function(i){
  window.api('/routes/'+i, {method:'DELETE'}).then(function(){ window.toast('已删除'); window.render_routes(); }).catch(function(err){ window.toast(err.message,'err'); });
};

// ===================================================================
//  后台登录 / Session / 改密
// ===================================================================
window.fetchWithAuth = function(url, opts){
  opts = opts || {};
  return fetch(url, opts).then(function(r){
    if(r.status === 401){
      window.location.href = '/admin?login';
      throw new Error('未登录');
    }
    return r;
  });
};

// 所有后台 API 请求走 fetchWithAuth（401 自动跳登录页）
window.api = function(path, opts){
  opts = opts || {};
  return window.fetchWithAuth('/admin/api' + path, {
    method: opts.method || 'GET',
    headers: opts.body ? {'Content-Type':'application/json'} : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    if(!r.ok) return r.json().then(function(e){ throw new Error(e.error || ('HTTP '+r.status)); }, function(){ throw new Error('HTTP '+r.status); });
    return r.json();
  });
};

// ---------- 登录 ----------
function bindLogin(){
  var form = $('#login-form');
  if(!form) return;
  var btn = $('#login_btn');
  form.addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
  btn && btn.addEventListener('click', doLogin);
}
function doLogin(){
  var user = ($('#login_user').value||'').trim();
  var pass = $('#login_pass').value || '';
  var err = $('#login_err');
  var btn = $('#login_btn');
  if(!user || !pass){ err.textContent = '请输入用户名和密码'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = '登录中…';
  fetch('/admin/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username: user, password: pass})
  }).then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
    .then(function(res){
      if(res.ok && res.d && res.d.ok){
        window.toast('登录成功');
        $('#login-page').style.display = 'none';
        bootApp();
      } else {
        err.textContent = (res.d && res.d.error) || '登录失败';
        err.style.display = 'block';
      }
    }).catch(function(e){
      err.textContent = '网络错误：' + (e&&e.message||e);
      err.style.display = 'block';
    }).finally(function(){
      btn.disabled = false; btn.textContent = '登 录';
    });
}

// ---------- 登出 ----------
window.logout = function(){
  fetch('/admin/api/auth/logout', {method:'POST'}).finally(function(){
    window.location.href = '/admin?login';
  });
};

// ---------- 改密 ----------
window.openChangePass = function(){ var m = $('#changePassModal'); if(m) m.classList.add('on'); };
window.closeChangePass = function(){ var m = $('#changePassModal'); if(m) m.classList.remove('on'); };
window.submitChangePass = function(){
  var oldP = $('#cp_old').value || '';
  var newP = $('#cp_new').value || '';
  var err = $('#cp_err');
  if(!oldP || !newP){ err.textContent = '请填写完整'; err.style.display = 'block'; return; }
  if(newP.length < 6){ err.textContent = '新密码至少 6 位'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  window.api('/auth/change-pass', {method:'POST', body:{oldPass: oldP, newPass: newP}})
    .then(function(d){
      window.toast((d&&d.message)||'密码已更新，请重新登录');
      window.closeChangePass();
      setTimeout(window.logout, 1200);
    }).catch(function(e){ err.textContent = e.message; err.style.display = 'block'; });
};

// ---------- 入口：先校验登录态 ----------
function initAuth(){
  var loginPage = $('#login-page');
  if(!loginPage) { bootApp(); return; }
  fetch('/admin/api/auth/me', {headers: {}})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.loggedIn){
        loginPage.style.display = 'none';
        bootApp();
      } else {
        loginPage.style.display = 'flex';
      }
    }).catch(function(){
      // 即使 /auth/me 失败（例如首次部署后端已设 cookie 保护），也显示登录页让用户输入
      if(loginPage) loginPage.style.display = 'flex';
    });
}

// 把原 boot 改名为 bootApp，仅在校验通过后调用一次
window.bootApp = function(){
  if(window.__booted) return;
  window.__booted = true;
  initTheme();
  initBurger();
  initNav();
  initTableActions();
  tickClock();
  setInterval(tickClock, 30000);
  var hash = (location.hash||'').replace('#','');
  var tab = ['providers','keys','latency','usage','logs','routes'].indexOf(hash) >= 0 ? hash : 'providers';
  window.loadTab(tab);
};

// 登录页事件必须在启动后台之前就绑定：否则首次加载（未登录）时
// 登录按钮没有 click/submit 监听，点登录会毫无反应。
bindLogin();

// DOM 就绪后先做认证，再决定是否启动后台
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initAuth);
} else {
  initAuth();
}
</script>
